[workspace]
members = ["crates/tapestry-protocol", "crates/tapestry-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["TapestryWorks"]
repository = "https://github.com/TapestryWorks/tapestry"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
tracing = "0.1"

tapestry-protocol = { path = "crates/tapestry-protocol" }
