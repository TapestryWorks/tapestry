[workspace]
members = [
    "crates/tapestry-protocol",
    "crates/tapestry-core",
    "crates/tapestry-adapter-agui",
    "crates/tapestry-adapter-a2a",
    "crates/tapestry-adapter-cli",
    "crates/tapestry-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["TapestryWorks"]
repository = "https://github.com/TapestryWorks/tapestry"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
tracing = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
iana-time-zone = "0.1"

tapestry-protocol = { path = "crates/tapestry-protocol" }
genai = "0.6"
futures-util = { version = "0.3", default-features = false }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_yaml_ng = "0.10"
url = "2"
tempfile = "3"
