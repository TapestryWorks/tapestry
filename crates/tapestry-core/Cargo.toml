[package]
name = "tapestry-core"
description = "Tapestry agent core: thread lifecycle, agent loop, model interaction"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[example]]
name = "minimal_turn"
path = "examples/minimal_turn.rs"

[[example]]
name = "genai_multi_provider"
path = "examples/genai_multi_provider.rs"

[[test]]
name = "genai_integration"
path = "tests/genai_integration.rs"

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
iana-time-zone = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
tapestry-protocol = { workspace = true }
genai = { workspace = true }
futures-util = { workspace = true }
[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread", "net", "io-util"] }
